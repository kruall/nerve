# Nerve — Personal AI Assistant Configuration
# Copy to config.yaml and customize. Secrets go in config.local.yaml (gitignored).

# Core
workspace: ~/nerve-workspace    # Path to workspace with SOUL.md, MEMORY.md, etc.
timezone: America/New_York

# Optional allowlist for detached commands in synchronized remote Git
# worktrees. Agents address only the host alias ("ydb-builder"), never the
# hostname or remote paths.
# remote_worktrees:
#   hosts:
#     ydb-builder:
#       fqdn: build.example.internal
#       ssh_user: builder
#       ssh_port: 22
#       ssh_args: ["-o", "BatchMode=yes"]
#       repositories:
#         ydb:
#           local_worktree_root: ~/git/ydb-worktrees
#           remote_bare_repo: /home/builder/.cache/nerve/ydb.git
#           remote_checkout_root: /home/builder/.cache/nerve/ydb-worktrees

# Provider — how Nerve connects to Claude (default: anthropic)
# provider:
#   type: bedrock              # "anthropic" or "bedrock"
#   aws_region: us-east-1      # AWS region for Bedrock
#   # aws_profile: ""          # Optional: AWS SSO profile name

# Local proxy (CLIProxyAPI) — optional. Routes Anthropic API calls through
# Claude Code OAuth, and is the Anthropic↔OpenAI translation layer that local
# Ollama models are reached through. Required for the ollama block below.
# proxy:
#   enabled: false
#   port: 8317
#   host: 127.0.0.1

# Local Ollama — expose locally-installed Ollama models as selectable chat
# models in the web composer's model picker. Ollama speaks an OpenAI-compatible
# API, so this requires proxy.enabled: true (the proxy translates the
# Anthropic requests the SDK emits). Models are auto-discovered at runtime
# from the running Ollama server (GET /api/tags) — whatever you've pulled
# locally shows up automatically, no need to list models here.
# ollama:
#   enabled: false
#   host: 127.0.0.1
#   port: 11434

# Agent
agent:
  model: claude-opus-4-8         # Primary model for conversations
  # Use claude-fable-5 for Anthropic's most capable (Mythos-class) model.
  # Note: ~2x the cost of Opus 4.8 ($10/$50 per MTok in/out).
  cron_model: claude-sonnet-4-6  # Cheaper model for cron jobs
  title_model: claude-haiku-4-5-20251001  # Session title generation
  max_turns: 50                  # Max agentic turns per request
  max_concurrent: 4              # Max concurrent agent sessions
  background_agent_permissions: true  # Background sub-agents (Agent run_in_background) get the same tool permissions as foreground; false denies their Write/Edit/Bash
  # First-prompt rewrite — the web UI can refine the opening message of a
  # new chat with a fast model, preview it, and send only after approval.
  prompt_rewrite:
    enabled: true                # Master switch (per-user toggle is in the UI)
    model: ""                    # Empty → falls back to agent.model (chat model)
    max_tokens: 1024
    timeout_seconds: 45
  # For Bedrock, use model IDs like:
  #   model: us.anthropic.claude-opus-4-8
  #   cron_model: us.anthropic.claude-sonnet-4-6
  #   title_model: us.anthropic.claude-haiku-4-5-20251001-v1:0

# Codex backend and adaptive model routing (optional). When enabled, new
# interactive sessions start at Luna/high and may move one adjacent tier at a
# time through the session-bound change_model_tier tool. Existing sessions keep
# their stored tier/model/effort.
# agent:
#   backend: codex
#   cron_backend: codex
# codex:
#   model: gpt-5.6-sol       # legacy fallback if default_tier is empty
#   default_tier: luna-high
#   model_tiers:
#     - {id: luna-high, model: gpt-5.6-luna, effort: high}
#     - {id: terra-high, model: gpt-5.6-terra, effort: high}
#     - {id: sol-medium, model: gpt-5.6-sol, effort: medium}
#     - {id: sol-xhigh, model: gpt-5.6-sol, effort: xhigh}
#   routing_policy_file: ~/.nerve/model-routing-policy.md

# Gateway
gateway:
  host: 0.0.0.0
  port: 8900
  ssl:
    cert: ~/.nerve/certs/cert.pem
    key: ~/.nerve/certs/key.pem

# Channels
telegram:
  enabled: true
  # DM authorization:
  #   pairing — only users in allowed_users may talk to the bot. New users
  #             authorize with a one-time code: run `nerve pair` on the
  #             server, then send the bot `/pair <code>`. Paired IDs are
  #             persisted to config.local.yaml automatically.
  #   open    — anyone can talk to the bot (dangerous: full agent access).
  dm_policy: pairing
  # allowed_users: [123456789]   # numeric Telegram user IDs (or pair instead)
  stream_mode: partial           # "partial" (edit messages) or "full" (wait for complete)

# Native Discord channel. Keep the bot token in config.local.yaml or,
# preferably, in a chmod-600 file outside this repository. The adapter accepts
# messages only from the configured guild, channels/project forums, and authors.
discord:
  # Agent session output is never forwarded automatically. Discord-visible
  # replies are sent deliberately through the session-bound discord_send MCP tool.
  # A mention in an ordinary text channel starts a conversation thread. Further
  # messages in that thread do not need mentions. Project-forum threads continue
  # to require a mention for each agent turn; allowed messages between turns are
  # retained as bounded rolling context and added to the next invoked turn.
  enabled: false
  # bot_token_file: ~/.config/nerve/discord-bot-token
  # guild_id: 123456789012345678
  # channel_ids: [123456789012345679]
  # Each project uses a separate Discord forum channel.
  # task_forums:
  #   YDB: 123456789012345680
  #   NERVE: 123456789012345681
  # Opt-in autonomous task selection. Nerve scans all configured project
  # forums, claims the oldest `ready-for-agent` task, and runs only one such
  # task session at a time.
  # project_task_runner_enabled: false
  # project_task_runner_poll_interval_seconds: 60
  # Optional trusted local policy added only to autonomous planning and
  # implementation sessions for the named project. It is not included in
  # ordinary Discord conversations. Use it for project-specific release or
  # handoff requirements; do not put secrets here. Keys must exist in
  # task_forums.
  # project_task_runner_instructions:
  #   NERVE: |
  #     Before ready-for-user, integrate the verified change and complete the
  #     requested restart and live validation.
  # Nerve creates a pinned "Project prompt" thread in every configured project
  # forum. Split the working instructions across as many allowed-author messages
  # as needed; Nerve joins them chronologically and reflects edits or deletions
  # when adding the combined prompt to other forum threads.
  # Optional initial Codex tier for ordinary project sessions and the planning
  # pass of an autonomous task. Autonomous execution receives the global
  # codex.default_tier after the planner hands its plan over. Keys must also be
  # present in task_forums; existing sessions keep their stored tier.
  # project_model_tiers:
  #   YDB: sol-medium
  #   NERVE: terra-high
  # Optional planner-only tier for autonomous project tasks. When a project is
  # omitted here, its project_model_tiers value is used for planning. The
  # implementation session still uses the global codex.default_tier.
  # project_planner_model_tiers:
  #   NERVE: sol-xhigh
  # Optional shared skill forum. Nerve creates one thread per local skill,
  # attaches exact SKILL.md snapshots after creation and updates, and accepts
  # mention/reply-driven discussion in managed skill threads. Threads and
  # attachments are visible to every Discord member who can access the forum.
  # skills_forum_id: 123456789012345683
  # Optional outbound-only forum. Nerve creates one thread per session and
  # mirrors visible messages, tool activity, lifecycle events, and errors.
  # Historical sessions are not backfilled until they become active; existing
  # mirror threads are reconciled after every restart. The same forum also
  # contains an unpinned "System" lifecycle feed plus "Notifications",
  # "Questions", and "Approvals" inbox threads with persistent controls.
  # Discord permits one pinned forum thread, so only "Approvals" is pinned.
  # When available, the exact "system" and "user-inbox" tags are applied to
  # the System thread; "user-inbox" is also applied to all three inbox threads.
  # When the forum contains the six managed session tags documented in
  # docs/config.md, each mirror thread automatically receives one type and
  # one state tag.
  # audit_forum_id: 123456789012345682
  # Collect session activity before updating Discord. Terminal events flush
  # immediately. Set to 0 only when immediate audit updates are required.
  audit_batch_window_seconds: 60
  # Optional compact bot activity, for example:
  # "Nerve · 2 active · Codex 73% left". This exposes operational data to
  # every member who can see the bot, so it is disabled by default.
  presence_enabled: false
  # Refresh Codex quota in the presence periodically. Live session and quota
  # events update the activity sooner, with Discord-safe rate limiting.
  presence_refresh_interval_seconds: 300
  # allowed_author_ids: [123456789012345681]
  # Applies to ordinary-channel entry messages and project-forum threads.
  # Conversation threads created below ordinary channels are always mention-free.
  require_mention: true

# Quiet hours (local timezone)
quiet_start: "02:00"
quiet_end: "12:00"

# Sync sources
sync:
  telegram:
    enabled: true
    monitored_folders: [Work, Friends]
  gmail:
    enabled: true
    accounts: []                 # Set in config.local.yaml
    schedule: "*/15 * * * *"
  github:
    enabled: true
    schedule: "*/15 * * * *"
    # Guardrails — limit which repos reach the inbox (case-insensitive globs).
    # allow_repos = allowlist (empty = all); deny_repos takes precedence.
    allow_repos: []                # Example: ["ClickHouse/*", "myorg/myrepo"]
    deny_repos: []
  github_repos:                    # Monitor a set of repos for NEW issues & PRs
    enabled: false
    schedule: "*/15 * * * *"
    repos: []                      # Required: ["ClickHouse/clickhouse-go", "owner/repo"]
    batch_size: 50

# Memory (memU)
memory:
  provider: inherit                       # inherit | anthropic | bedrock | codex
  recall_model: claude-sonnet-4-6         # LLM ranking when embeddings are disabled
  memorize_model: claude-sonnet-4-6       # Fact extraction
  fast_model: claude-haiku-4-5-20251001   # Preprocessing, categories, dates, filtering
  # embed_model: text-embedding-3-small    # Requires top-level openai_api_key
  # codex_workers: 2                       # 1-4 isolated app-server workers
  # codex_effort: low                      # low | medium | high | xhigh | max | ultra

  # With provider: codex, use Codex model IDs available to the authenticated
  # account for all three profiles, for example:
  # recall_model: gpt-5.6-terra
  # memorize_model: gpt-5.6-terra
  # fast_model: gpt-5.6-terra

# Cron
cron:
  system_file: ~/.nerve/cron/system.yaml   # Managed by 'nerve init' — system crons
  jobs_file: ~/.nerve/cron/jobs.yaml       # Your custom crons — never touched by Nerve

# Backup (optional) — scheduled, verified snapshots of Nerve state into a
# single portable bundle (nerve-backup-<host>-<ts>.tar.zst). Off by default.
# Point target_dir at an external mount or a synced directory — the OFF-BOX
# copy is what protects against a disk failure. The SQLite DBs are snapshotted
# with the online-backup API, so bundles are consistent even while Nerve runs.
# Manual use: `nerve backup` / `nerve restore BUNDLE` (no running server needed).
# backup:
#   enabled: false
#   target_dir: ""              # e.g. /mnt/backup/nerve  (REQUIRED when enabled)
#   interval_hours: 24          # scheduled cadence (an hourly tick fires when due)
#   retention_count: 7          # keep the newest N bundles; prune older ones
#   include_workspace: true     # include the workspace BRAIN (*.md, memory/, scripts/, skills/)
#   workspace_excludes: []      # extra glob patterns to skip, e.g. ["*.png", "drafts"]
#   notify_on_failure: true     # high-priority notify if a scheduled backup fails
#   notify_on_success: false    # low-priority digest line on success

# External MCP server (optional) — expose Nerve's tool registry to
# external MCP clients (Codex, Claude Code, Cursor) over Streamable HTTP.
# Off by default. Authentication reuses the gateway JWT
# (auth.jwt_secret) — present it as `Authorization: Bearer <jwt>` or
# `?token=<jwt>`. Connect a client with the URL "https://<host>:8900/mcp/v1/".
# mcp_endpoint:
#   enabled: false
#   path: /mcp/v1
#   include_hoa: false   # Expose hoa_* tools externally (default off)

# Observability (optional) — Langfuse tracing for the agent loop and memU.
# Set keys in config.local.yaml. Without keys, the integration is a no-op.
# See docs/observability.md for setup details.
# langfuse:
#   public_key: pk-lf-...        # from your Langfuse project (set in config.local.yaml)
#   secret_key: sk-lf-...        # from your Langfuse project (set in config.local.yaml)
#   host: https://cloud.langfuse.com
#   # redact_patterns:           # optional — strip these regexes from spans
#   #   - "sk-ant-[A-Za-z0-9_\\-]{20,}"
